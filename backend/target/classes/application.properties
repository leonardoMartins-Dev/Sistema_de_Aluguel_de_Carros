spring.application.name=aluguelcarros

# Lê o .env tanto rodando de dentro de backend/ quanto da raiz do projeto (VS Code)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=8080

# Banco - Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Front-end liberado no CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# Senha dos agentes criados pelo DataSeeder (logins "empresa" e "banco")
app.seed.senha-agentes=${SEED_SENHA_AGENTES:123456}